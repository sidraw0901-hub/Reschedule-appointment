<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareBridge — Reactive Re-Scheduling Engine (4-Slot Capacity Limit)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-dot {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [systemStatus, setSystemStatus] = useState(null);
      const [appointments, setAppointments] = useState([]);
      const [pendingSuggestions, setPendingSuggestions] = useState([]);
      const [providerBandwidths, setProviderBandwidths] = useState([]);
      const [activeModalSuggestion, setActiveModalSuggestion] = useState(null);
      const [notification, setNotification] = useState(null);
      const [selectedSpecialty, setSelectedSpecialty] = useState('ALL');
      const [actionLoading, setActionLoading] = useState(false);
      const [togglingProviderId, setTogglingProviderId] = useState(null);

      const showNotification = (msg, type = 'info') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 5000);
      };

      const fetchData = async () => {
        try {
          const [statusRes, apptsRes, suggRes, bandRes] = await Promise.all([
            fetch('/api/suggestions/system/status'),
            fetch('/api/appointments'),
            fetch('/api/suggestions/pending'),
            fetch('/api/providers/bandwidth')
          ]);

          if (statusRes.ok) setSystemStatus(await statusRes.json());
          if (apptsRes.ok) setAppointments(await apptsRes.json());
          if (suggRes.ok) setPendingSuggestions(await suggRes.json());
          if (bandRes.ok) setProviderBandwidths(await bandRes.json());
        } catch (err) {
          console.error("Polling error:", err);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 1800);
        return () => clearInterval(interval);
      }, []);

      // Toggle Provider Availability
      const handleToggleDoctor = async (providerId, currentStatus, providerName) => {
        setTogglingProviderId(providerId);
        try {
          if (currentStatus === 'AVAILABLE') {
            const res = await fetch(`/api/providers/${providerId}/offline`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reason: "Doctor reported unavailable / sudden illness" })
            });
            const data = await res.json();
            showNotification(
              `⚡ ${providerName} is now UNAVAILABLE. ${data.affectedAppointmentCount} appointment(s) queued for rebooking.`,
              'warning'
            );
          } else {
            await fetch(`/api/providers/${providerId}/restore`, { method: 'POST' });
            showNotification(`✓ ${providerName} is now restored to AVAILABLE! Their open slots can now accept appointments again.`, 'success');
          }
          await fetchData();
        } catch (e) {
          showNotification("Error updating doctor status: " + e.message, 'error');
        } finally {
          setTogglingProviderId(null);
        }
      };

      // Coordinator Accept
      const handleAccept = async (suggestionId) => {
        setActionLoading(true);
        try {
          const res = await fetch(`/api/suggestions/${suggestionId}/accept`, { method: 'POST' });
          if (res.status === 409) {
            const errData = await res.json();
            showNotification(errData.message || "409 CONFLICT: Slot already claimed by another coordinator!", 'error');
          } else if (res.ok) {
            showNotification("✓ Rebooked successfully! Replaced original doctor and increased receiving doctor's slot count.", 'success');
            setActiveModalSuggestion(null);
          } else {
            showNotification("Error accepting recommendation", 'error');
          }
          await fetchData();
        } catch (e) {
          showNotification("Network error accepting recommendation", 'error');
        } finally {
          setActionLoading(false);
        }
      };

      // Coordinator Reject
      const handleReject = async (suggestionId) => {
        setActionLoading(true);
        try {
          await fetch(`/api/suggestions/${suggestionId}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: "Declined by patient" })
          });
          showNotification("Suggestion declined.", 'info');
          setActiveModalSuggestion(null);
          await fetchData();
        } catch (e) {
          showNotification("Error rejecting recommendation", 'error');
        } finally {
          setActionLoading(false);
        }
      };

      const formatTime = (isoString) => {
        if (!isoString) return "N/A";
        return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      const formatDate = (isoString) => {
        if (!isoString) return "";
        return new Date(isoString).toLocaleDateString([], { month: 'short', day: 'numeric' });
      };

      const suggestionMap = {};
      pendingSuggestions.forEach(s => { suggestionMap[s.appointmentId] = s; });

      const filteredProviders = selectedSpecialty === 'ALL'
        ? providerBandwidths
        : providerBandwidths.filter(p => p.specialty === selectedSpecialty);

      const specialties = ['ALL', ...new Set(providerBandwidths.map(p => p.specialty))];

      const availableCount = providerBandwidths.filter(p => p.status === 'AVAILABLE').length;
      const totalBandwidth = providerBandwidths
        .filter(p => p.status === 'AVAILABLE')
        .reduce((acc, curr) => acc + curr.availableBandwidth, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-teal-700 to-teal-500 flex items-center justify-center text-white font-black text-xl shadow-md">
                  CB
                </div>
                <div>
                  <h1 className="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    CareBridge
                    <span className="text-[11px] font-semibold uppercase px-2 py-0.5 rounded bg-teal-100 text-teal-800">
                      Doctor 4-Slot Max Capacity Engine
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500">Fixed 4 Slots Max Per Doctor • Autonomous Overload Redistribution</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <div className="hidden sm:flex items-center space-x-2 text-xs bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot"></span>
                  <span className="font-medium text-slate-700">Autonomous Worker: Active</span>
                  <span className="text-slate-300">|</span>
                  <span className="text-slate-600">Events: {systemStatus ? systemStatus.totalOutboxEvents : 0}</span>
                </div>

                <button
                  onClick={fetchData}
                  className="px-3 py-1.5 text-xs font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition shadow-sm"
                >
                  Refresh Data
                </button>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 w-full">
              <div className={`p-4 rounded-xl shadow-sm border flex items-center justify-between text-sm ${
                notification.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                notification.type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' :
                notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                'bg-blue-50 border-blue-200 text-blue-800'
              }`}>
                <div className="flex items-center space-x-2">
                  <span className="font-bold uppercase text-xs tracking-wider">
                    {notification.type === 'error' ? '⚠ Conflict' : notification.type === 'warning' ? '⚡ Outage Disruption' : '✓ Update'}
                  </span>
                  <span>{notification.msg}</span>
                </div>
                <button onClick={() => setNotification(null)} className="text-xs font-bold hover:underline">✕</button>
              </div>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 flex-1 w-full">
            {/* Top Metrics Bar */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Available Physicians</span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-2xl font-black text-slate-900">{availableCount}</span>
                  <span className="text-xs font-semibold text-slate-400">/ {providerBandwidths.length} Total</span>
                </div>
                <span className="text-xs text-emerald-600 font-medium">Ready to accept appointments</span>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-[11px] font-bold text-teal-700 uppercase tracking-wider">Total Clinic Bandwidth</span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-2xl font-black text-teal-800">{totalBandwidth}</span>
                  <span className="text-xs font-semibold text-slate-400">Open Slots (4 Max / Doc)</span>
                </div>
                <span className="text-xs text-teal-600 font-medium">Available to absorb rebookings</span>
              </div>

              <div className={`p-4 rounded-xl border shadow-sm ${
                (systemStatus?.affectedAppointments || 0) > 0 ? 'bg-rose-50/70 border-rose-200' : 'bg-white border-slate-200'
              }`}>
                <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider">Disrupted (In Triage)</span>
                <p className="text-2xl font-black text-rose-700 mt-1">{systemStatus ? systemStatus.affectedAppointments : 0}</p>
                <span className="text-xs text-rose-500 font-medium">AI matching to doctors with open slots</span>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider">Rescheduled & Assigned</span>
                <p className="text-2xl font-black text-emerald-700 mt-1">{systemStatus ? systemStatus.rescheduledAppointments : 0}</p>
                <span className="text-xs text-emerald-600 font-medium">Transferred to receiving doctor</span>
              </div>
            </div>

            {/* Doctor 4-Slot Capacity Center */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-3 border-b border-slate-100">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-teal-100 text-teal-800">
                      Capacity Policy: 4 Slots Max
                    </span>
                    <h2 className="text-base font-bold text-slate-900">Physician Availability & Slot Usage</h2>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Toggle a doctor <b>Unavailable</b> to trigger rebooking. Once accepted, their patient moves to a colleague with open slots (under 4 slots) and increases the colleague's slot count!
                  </p>
                </div>

                {/* Filter */}
                <div className="flex items-center space-x-1 overflow-x-auto">
                  {specialties.map(spec => (
                    <button
                      key={spec}
                      onClick={() => setSelectedSpecialty(spec)}
                      className={`text-xs px-2.5 py-1 rounded-md font-medium transition ${
                        selectedSpecialty === spec
                          ? 'bg-teal-600 text-white font-semibold'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {spec}
                    </button>
                  ))}
                </div>
              </div>

              {/* Doctors Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {filteredProviders.map(prov => {
                  const isAvailable = prov.status === 'AVAILABLE';
                  const isToggling = togglingProviderId === prov.providerId;
                  const booked = prov.bookedSlots;
                  const available = prov.availableBandwidth;
                  const total = 4;

                  return (
                    <div
                      key={prov.providerId}
                      className={`p-4 rounded-xl border transition-all relative ${
                        !isAvailable
                          ? 'bg-rose-50/50 border-rose-300 shadow-sm'
                          : available > 0
                          ? 'bg-white border-teal-200 shadow-sm hover:border-teal-400'
                          : 'bg-white border-slate-200 shadow-sm'
                      }`}
                    >
                      {/* Doctor Info & Toggle Switch */}
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <h4 className="font-bold text-sm text-slate-900">{prov.providerName}</h4>
                          <span className="text-[11px] font-semibold text-teal-700">{prov.specialty}</span>
                          <div className="text-[10px] text-slate-400 mt-0.5">{prov.roomName}</div>
                        </div>

                        {/* Interactive Toggle Switch */}
                        <div className="flex flex-col items-end">
                          <label className="relative inline-flex items-center cursor-pointer">
                            <input
                              type="checkbox"
                              checked={isAvailable}
                              disabled={isToggling || actionLoading}
                              onChange={() => handleToggleDoctor(prov.providerId, prov.status, prov.providerName)}
                              className="sr-only peer"
                            />
                            <div className="w-11 h-6 bg-rose-400 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500 shadow-inner"></div>
                          </label>
                          <span className={`text-[9px] font-bold mt-1 uppercase ${
                            isAvailable ? 'text-emerald-700 font-extrabold' : 'text-rose-600 font-extrabold'
                          }`}>
                            {isToggling ? 'Updating...' : isAvailable ? 'Available' : 'Unavailable'}
                          </span>
                        </div>
                      </div>

                      {/* 4 Discrete Slot Capacity Chips */}
                      <div className="mt-4 p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                        <div className="flex items-center justify-between text-xs font-semibold mb-1.5">
                          <span className="text-slate-600">Capacity (4 Max):</span>
                          <span className={`font-bold ${
                            !isAvailable ? 'text-rose-600' : available > 0 ? 'text-emerald-700' : 'text-amber-700'
                          }`}>
                            {!isAvailable ? 'Out of Service' : `${available} Available`}
                          </span>
                        </div>

                        {/* 4 Slot Blocks */}
                        <div className="grid grid-cols-4 gap-1.5">
                          {[0, 1, 2, 3].map(slotIdx => {
                            const isSlotBooked = slotIdx < booked;
                            const isSlotAvailable = !isSlotBooked && isAvailable;

                            return (
                              <div
                                key={slotIdx}
                                className={`h-6 rounded flex items-center justify-center text-[10px] font-bold transition-all ${
                                  !isAvailable ? 'bg-slate-200 text-slate-400 border border-slate-300' :
                                  isSlotBooked ? 'bg-rose-500 text-white shadow-xs' :
                                  'bg-emerald-500 text-white shadow-xs'
                                }`}
                                title={
                                  !isAvailable ? 'Doctor Unavailable' :
                                  isSlotBooked ? `Slot ${slotIdx + 1}: Booked` :
                                  `Slot ${slotIdx + 1}: Open to accept appointment`
                                }
                              >
                                {isSlotBooked ? 'Booked' : isAvailable ? 'Open' : 'Off'}
                              </div>
                            );
                          })}
                        </div>

                        <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-medium">
                          <span>{booked} of 4 Booked</span>
                          <span>{available} Slots Free</span>
                        </div>
                      </div>

                      {/* Action Button */}
                      <div className="mt-3 pt-3 border-t border-slate-100">
                        {isAvailable ? (
                          <button
                            disabled={isToggling || actionLoading}
                            onClick={() => handleToggleDoctor(prov.providerId, prov.status, prov.providerName)}
                            className="w-full py-1 text-[11px] font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg transition border border-rose-200"
                          >
                            Mark Doctor Unavailable
                          </button>
                        ) : (
                          <button
                            disabled={isToggling || actionLoading}
                            onClick={() => handleToggleDoctor(prov.providerId, prov.status, prov.providerName)}
                            className="w-full py-1 text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition shadow-sm"
                          >
                            Restore to Available
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Appointments Table: Clean Removal of Original Doctor */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h3 className="text-base font-bold text-slate-900">
                    Appointments & Active Physician Roster
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    When rebooked, the original doctor is removed and replaced by the receiving physician whose slot count increases.
                  </p>
                </div>
                <div className="text-xs text-slate-500 font-semibold">
                  {appointments.length} Appointments on Roster
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider border-b border-slate-200">
                    <tr>
                      <th className="px-4 py-3">Patient</th>
                      <th className="px-4 py-3">Assigned Physician</th>
                      <th className="px-4 py-3">Scheduled Time & Room</th>
                      <th className="px-4 py-3">Status</th>
                      <th className="px-4 py-3">AI Rebook Option</th>
                      <th className="px-4 py-3">Strategy & Confidence</th>
                      <th className="px-4 py-3 text-right">Coordinator Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {appointments.map(appt => {
                      const suggestion = suggestionMap[appt.appointmentId];
                      const isDisrupted = appt.status === 'RESCHEDULE_REQUIRED';
                      const isRescheduled = appt.status === 'RESCHEDULED';

                      return (
                        <tr key={appt.appointmentId} className={`transition-colors ${
                          isDisrupted ? 'bg-amber-50/50 hover:bg-amber-50/70' :
                          isRescheduled ? 'bg-emerald-50/40 hover:bg-emerald-50/60' : 'hover:bg-slate-50/60'
                        }`}>
                          {/* Patient */}
                          <td className="px-4 py-3.5">
                            <div className="font-bold text-slate-900">{appt.patientName}</div>
                            <div className="text-[11px] text-slate-500">{appt.patientPhone}</div>
                            <span className={`inline-block text-[9px] font-bold px-1.5 py-0.2 rounded mt-0.5 ${
                              appt.priorityLevel === 'URGENT' ? 'bg-red-100 text-red-700' :
                              appt.priorityLevel === 'HIGH' ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-600'
                            }`}>
                              {appt.priorityLevel} PRIORITY
                            </span>
                          </td>

                          {/* Physician: Shows strictly the assigned doctor! */}
                          <td className="px-4 py-3.5">
                            {isRescheduled ? (
                              <div>
                                <div className="font-bold text-emerald-900 flex items-center gap-1.5">
                                  <span>{appt.providerName}</span>
                                  <span className="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded">
                                    NEW DOCTOR (+1 SLOT)
                                  </span>
                                </div>
                                <div className="text-emerald-700 text-[11px]">{appt.specialty}</div>
                              </div>
                            ) : isDisrupted ? (
                              <div>
                                <div className="font-medium text-slate-400 line-through">{appt.providerName}</div>
                                <div className="text-rose-600 font-bold text-[11px]">Doctor Unavailable</div>
                              </div>
                            ) : (
                              <div>
                                <div className="font-semibold text-slate-900">{appt.providerName}</div>
                                <div className="text-slate-500 text-[11px]">{appt.specialty}</div>
                              </div>
                            )}
                          </td>

                          {/* Time & Room */}
                          <td className="px-4 py-3.5">
                            <div className="font-semibold text-slate-800">
                              {formatDate(appt.startTime)} at {formatTime(appt.startTime)}
                            </div>
                            <div className="text-slate-500 text-[11px]">{appt.roomName}</div>
                          </td>

                          {/* Status */}
                          <td className="px-4 py-3.5">
                            {isDisrupted && (
                              <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">
                                ⚠ RESCHEDULE REQUIRED
                              </span>
                            )}
                            {isRescheduled && (
                              <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                                ✓ RESCHEDULED
                              </span>
                            )}
                            {appt.status === 'BOOKED' && (
                              <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-slate-100 text-slate-700">
                                SCHEDULED (OK)
                              </span>
                            )}
                          </td>

                          {/* Suggested Rebook Option */}
                          <td className="px-4 py-3.5">
                            {suggestion ? (
                              <div className="space-y-0.5">
                                <div className="font-bold text-teal-900 flex items-center gap-1">
                                  <span>{suggestion.recommendedProviderName}</span>
                                  <span className="text-[9px] bg-teal-100 text-teal-800 font-bold px-1 py-0.2 rounded">
                                    Has Available Slot
                                  </span>
                                </div>
                                <div className="text-slate-700 text-[11px]">
                                  {formatDate(suggestion.recommendedSlotTime)} at <span className="font-bold">{formatTime(suggestion.recommendedSlotTime)}</span>
                                </div>
                              </div>
                            ) : isRescheduled ? (
                              <span className="text-xs text-emerald-700 font-semibold">Rebooked & Slot Assigned</span>
                            ) : isDisrupted ? (
                              <span className="text-xs text-amber-700 italic">Matching to doctors with open slots...</span>
                            ) : (
                              <span className="text-xs text-slate-400">—</span>
                            )}
                          </td>

                          {/* Strategy & Confidence */}
                          <td className="px-4 py-3.5">
                            {suggestion ? (
                              <div className="space-y-1">
                                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800 border border-purple-200">
                                  ✨ AI-POWERED
                                </span>
                                <div className="text-[11px] font-semibold text-teal-700">
                                  {Math.round(suggestion.confidence * 100)}% Match Score
                                </div>
                              </div>
                            ) : (
                              <span className="text-xs text-slate-400">—</span>
                            )}
                          </td>

                          {/* Actions */}
                          <td className="px-4 py-3.5 text-right">
                            {suggestion && suggestion.status === 'PENDING' ? (
                              <button
                                onClick={() => setActiveModalSuggestion(suggestion)}
                                className="px-3.5 py-1.5 bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white rounded-lg font-semibold text-xs shadow-sm transition"
                              >
                                Review & Rebook
                              </button>
                            ) : isRescheduled ? (
                              <span className="text-xs text-emerald-700 font-bold">Confirmed</span>
                            ) : (
                              <span className="text-xs text-slate-400">No Action</span>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Modal */}
          {activeModalSuggestion && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full shadow-2xl border border-slate-200 overflow-hidden animate-in fade-in">
                <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 bg-teal-400 text-slate-950 font-bold text-[10px] uppercase rounded">
                      Doctor Transfer
                    </span>
                    <h3 className="text-base font-bold">Reschedule & Increment Receiving Doctor Slot</h3>
                  </div>
                  <button
                    onClick={() => setActiveModalSuggestion(null)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-5 text-sm">
                  {/* Patient Info */}
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div>
                      <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Patient</span>
                      <div className="text-base font-bold text-slate-900">{activeModalSuggestion.patientName}</div>
                      <div className="text-xs text-slate-500">{activeModalSuggestion.patientPhone}</div>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">AI Confidence</span>
                      <div className="text-base font-bold text-teal-600">
                        {Math.round(activeModalSuggestion.confidence * 100)}% Match
                      </div>
                      <span className="text-[10px] text-purple-700 font-bold uppercase">
                        Slot Availability Match
                      </span>
                    </div>
                  </div>

                  {/* Doctor Transition */}
                  <div className="grid grid-cols-2 gap-3">
                    <div className="p-3 bg-rose-50 border border-rose-100 rounded-lg">
                      <div className="text-[10px] font-bold text-rose-700 uppercase tracking-wider">Original Doctor (Cancelled)</div>
                      <div className="text-xs font-semibold text-slate-800 line-through mt-1">
                        {activeModalSuggestion.originalProviderName}
                      </div>
                      <div className="text-[11px] text-slate-500">
                        {formatDate(activeModalSuggestion.originalSlotTime)} at {formatTime(activeModalSuggestion.originalSlotTime)}
                      </div>
                    </div>

                    <div className="p-3 bg-teal-50 border border-teal-200 rounded-lg">
                      <div className="text-[10px] font-bold text-teal-800 uppercase tracking-wider">New Assigned Doctor (+1 Slot)</div>
                      <div className="text-xs font-bold text-teal-900 mt-1">
                        {activeModalSuggestion.recommendedProviderName}
                      </div>
                      <div className="text-[11px] text-teal-700 font-semibold">
                        {formatDate(activeModalSuggestion.recommendedSlotTime)} at {formatTime(activeModalSuggestion.recommendedSlotTime)}
                      </div>
                      <div className="text-[10px] text-slate-500">{activeModalSuggestion.roomName}</div>
                    </div>
                  </div>

                  {/* Staff Call Script */}
                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                        📞 Staff Phone Script
                      </span>
                      <span className="text-[10px] text-slate-400">Read to patient</span>
                    </div>
                    <p className="text-xs text-slate-800 leading-relaxed italic bg-white p-3 rounded-lg border border-slate-200">
                      "{activeModalSuggestion.explanation}"
                    </p>
                  </div>

                  {/* Actions */}
                  <div className="pt-2 flex items-center justify-end space-x-3">
                    <button
                      disabled={actionLoading}
                      onClick={() => handleReject(activeModalSuggestion.suggestionId)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition"
                    >
                      Reject Option
                    </button>

                    <button
                      disabled={actionLoading}
                      onClick={() => handleAccept(activeModalSuggestion.suggestionId)}
                      className="px-5 py-2 bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-bold text-xs rounded-lg transition shadow-sm flex items-center gap-1.5"
                    >
                      <span>✓</span> Confirm Rebook & Increment Slot
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
