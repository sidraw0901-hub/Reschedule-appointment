version: '3.8'

services:
  carebridge-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carebridge-engine
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CAREBRIDGE_LLM_GATEWAY_URL=http://localhost:8080/mock-llm
    restart: unless-stopped
