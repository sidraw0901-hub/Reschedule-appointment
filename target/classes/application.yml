server:
  port: 8080

spring:
  application:
    name: carebridge-rescheduling-engine
  datasource:
    url: jdbc:h2:mem:carebridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

carebridge:
  strategy: AI_POWERED
  outbox:
    poll-interval-ms: 1000
    batch-size: 10
  llm:
    gateway-url: ${LLM_GATEWAY_URL:https://litellm-qc.zycus.net/v1/chat/completions}
    api-key: ${LLM_API_KEY:sk-SfyNGxhcv7RnQKbZFWX2LQ}
    model: ${LLM_MODEL:qwen-cursor}
    product: ${LLM_PRODUCT:PC1}
    cookie: ${LLM_COOKIE:6bf6da0e46dc446bd58693d49c303e18=f3f865650f0f8f3b30731936b2eb5857}
    timeout-ms: ${LLM_TIMEOUT_MS:15000}

logging:
  level:
    com.carebridge.rescheduling: INFO
